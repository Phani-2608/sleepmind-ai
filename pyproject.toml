[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepmind-ai"
version = "1.0.0"
description = "Agentic RAG with Sleep-Time Compute: pre-process research papers with autonomous agents before queries arrive."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Phanindra Reddy Mathireddy"}]
license = {text = "MIT"}
dependencies = [
    "openai>=1.10",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-core>=0.2",
    "faiss-cpu>=1.7",
    "pymupdf>=1.23",
    "tiktoken>=0.5",
    "networkx>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28", "httpx>=0.24"]
mlops = ["mlflow>=2.10"]
viz = ["pyvis>=0.3", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.24", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sleepmind_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
