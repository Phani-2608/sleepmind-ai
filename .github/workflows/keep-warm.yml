name: Keep SleepMind Warm

# Ping both Render services often enough to reduce cold starts.
# Keep each run short so scheduled jobs do not pile up or get cancelled.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping both services
        shell: bash
        run: |
          check_service() {
            url="$1"
            name="$2"

            for attempt in 1 2 3 4 5; do
              status=$(curl -L -sS -o /dev/null \
                --connect-timeout 10 \
                --max-time 20 \
                -w "%{http_code}" \
                "$url" || true)

              echo "$name attempt $attempt -> ${status:-000}"

              case "$status" in
                200|204|301|302|307|308)
                  return 0
                  ;;
              esac

              sleep 10
            done

            echo "::warning::$name did not return a healthy HTTP status after 5 attempts"
            return 0
          }

          check_service "https://sleepmind-ai-api.onrender.com/health" "api" &
          api_pid=$!

          check_service "https://sleepmind-ai-dashboard.onrender.com/" "dashboard" &
          dash_pid=$!

          wait "$api_pid"
          wait "$dash_pid"
